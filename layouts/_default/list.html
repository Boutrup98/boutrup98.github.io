{{ define "main" }}
<h2>{{ .Title }}</h2>
{{ .Content }}
<div class="time-list">
<ul>
{{ range .Pages }}
<li>
<time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "02-01-2006" }} · {{ .ReadingTime }}m</time>
<div><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></div>
</li>
{{ end }}
</ul>
</div>
<div class="divider"></div>
{{ end }}
